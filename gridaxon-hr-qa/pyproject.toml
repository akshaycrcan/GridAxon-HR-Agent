[project]
name = "gridaxon-hr-qa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "akshaycrcan", email = "akshayjaincr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.1",
    "huggingface-hub>=1.33.0",
    "langgraph>=1.2.17",
    "numpy>=2.5.4",
    "pysbd>=0.3.4",
    "python-frontmatter>=1.3.0",
    "streamlit>=1.57",
    "tiktoken>=0.14.0",
    "tokenizers>=0.23.3",
]

[project.scripts]
gridaxon-hr-qa = "gridaxon_hr_qa:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
